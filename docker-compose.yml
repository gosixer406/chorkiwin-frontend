# Each site has its own compose project, image and port, so deploying one
# site never replaces another site's container.
name: chorkiwin-frontend

services:
  web:
    build:
      context: .
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}

    image: chorkiwin-frontend:latest
    restart: unless-stopped

    ports:
      - "127.0.0.1:${APP_PORT:-8015}:80"

    volumes:
      - ${SHELL_HOST_DIR:-/var/www/chorki-projects/b2b-shell}/site-chorkiwin-frontend:/shell

networks:
  default:
    name: b2b-net
    external: true