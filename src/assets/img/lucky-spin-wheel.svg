<linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4A4A4A"/><stop offset="1" stop-color="#151515"/></linearGradient>
<radialGradient id="shade" r="0.5" cx="0.5" cy="0.5"><stop offset="0.2" stop-color="#000" stop-opacity="0.18"/><stop offset="0.75" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity="0.12"/></radialGradient>
<radialGradient id="hub" cx="0.35" cy="0.3" r="0.7"><stop offset="0" stop-color="#FFF2B0"/><stop offset="0.5" stop-color="#FFCB07"/><stop offset="1" stop-color="#9A6B00"/></radialGradient>
</defs>
