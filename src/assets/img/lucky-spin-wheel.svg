<svg xmlns="http://www.w3.org/2000/svg" viewBox="-150 -150 300 300">
<style><![CDATA[
/* Animated like a GIF, also when used as an img: the face spins up, slows and settles,
   then spins again (1080deg = 3 full turns, so the loop is seamless); rim bulbs twinkle
   in two alternating sets with a glow. */
.face{transform-box:fill-box;transform-origin:center;animation:spin 4.5s cubic-bezier(.2,.75,.25,1) infinite}
@keyframes spin{0%{transform:rotate(0)}78%,100%{transform:rotate(1080deg)}}
.bulb{fill:#FFF6C2;filter:drop-shadow(0 0 6px #FFCB07);animation:blink .5s linear infinite}
.bulb.alt{animation-delay:-.25s}
@keyframes blink{0%,49%{fill:#FFF6C2;filter:drop-shadow(0 0 6px #FFCB07)}50%,100%{fill:#5A4300;filter:none}}
@media (prefers-reduced-motion:reduce){.face,.bulb{animation:none}}
]]></style>
