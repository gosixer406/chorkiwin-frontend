    <meta name="description" content="Chorkiwala gaming application" />

    <meta property="og:site_name" content="Chorkiwala" />
    <meta property="og:title" content="Chorkiwala" />
    <meta property="og:description" content="Chorkiwala gaming application" />
    <meta property="og:url" content="https://chorkix.com/" />
    <meta property="og:image" content="https://chorkix.com/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Chorkiwala" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Chorkiwala" />
    <meta name="twitter:description" content="Chorkiwala gaming application" />
    <meta name="twitter:image" content="https://chorkix.com/og-image.png" />
    <link rel="preload" href="/loading-video/main-loading-poster.jpg" as="image" />
    <meta name="theme-color" content="#032125" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=yes, viewport-fit=cover" />
    <title>Chorkiwala</title>
    <script>
        // Apply the saved theme before first paint; light is the default.
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.querySelector('meta[name="theme-color"]').setAttribute('content', '#131A20');
            }
        } catch (e) {}
    </script>
    <style>
        /* First-load splash: the poster shows at once, the video fades in over it once it plays. */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            transition: opacity .45s ease;
        }
        #splash.is-done { opacity: 0; pointer-events: none; }
        #splash img,
        #splash video {
            position: absolute;
            width: 100%;
            max-width: 480px;
            height: 100%;
            object-fit: contain;
        }
        #splash video { opacity: 0; transition: opacity .3s ease; }
        #splash.is-playing video { opacity: 1; }
    </style>
</head>

<body style="background:#011B1F">
    <div id="splash" aria-hidden="true">
        <img src="/loading-video/main-loading-poster.jpg" alt="" />
        <video src="/loading-video/main-loading-video-web.mp4" muted playsinline autoplay preload="auto"></video>
    </div>
    <div id="root"></div>
    <script>
        (function () {
            var splash = document.getElementById('splash');
            var video = splash.querySelector('video');
            var closed = false;
            function close() {
                if (closed) return;
                closed = true;
                splash.classList.add('is-done');
                setTimeout(function () {
                    splash.remove();
                    window.dispatchEvent(new Event('splash:closed'));
                }, 500);
            }
            // The app closes the splash as soon as its first screen is ready; the
            // video never holds it back.
            window.__closeSplash = close;
            video.addEventListener('playing', function () { splash.classList.add('is-playing'); });
            video.addEventListener('ended', close);
            video.addEventListener('error', function () { setTimeout(close, 1200); });
            // Autoplay can be refused (e.g. data saver); keep the poster up briefly instead.
            var attempt = video.play && video.play();
            if (attempt && attempt.catch) attempt.catch(function () { setTimeout(close, 1200); });
            // Fallback if the app script is slow or fails to start.
            setTimeout(close, 4000);
        })();
    </script>
    <script type="module" src="/src/main.jsx"></script>


</body>

</html>
