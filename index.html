    <script>
        // Apply the saved theme before first paint; light is the default.
        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
            }
        } catch (e) {}
    </script>
    <style>
        /* First-load splash: paints before any JS or Tailwind. Keep it matching
           the Preloader in src/components/preloader.jsx. */
        #splash {
            position: fixed;
            inset: 0;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #1C1C1C;
            transition: opacity .45s ease;
        }
        #splash.is-done { opacity: 0; pointer-events: none; }
        #splash .mark { position: relative; z-index: 1; }
        #splash .mark svg {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: -20;
            transform: translate(-50%, -50%);
        }
        #splash .mark svg.cw { animation: splash-spin 2s linear infinite; }
        #splash .mark svg.ccw { animation: splash-spin 2s linear infinite reverse; }
        #splash .mark img {
            display: block;
            height: 36px;
            animation: splash-ping 1s cubic-bezier(0, 0, .2, 1) infinite;
        }
        #splash .status {
            display: flex;
            flex-direction: column;
            gap: 24px;
            width: 100%;
            max-width: 324px;
            margin-top: 100px;
            color: #A0A1A6;
            font: 500 16px/1.5 Poppins, Inter, ui-sans-serif, system-ui, sans-serif;
            letter-spacing: 5px;
            text-align: center;
            text-transform: uppercase;
        }
        #splash .track { position: relative; height: 4px; background: #333; }
        #splash .fill {
            position: absolute;
            top: 0;
            left: 0;
            width: 8%;
            height: 100%;
            background: linear-gradient(90deg, #D7B514 0%, #08B173 100%);
            animation: splash-progress 1.4s ease-in-out infinite;
        }
        @keyframes splash-spin {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to { transform: translate(-50%, -50%) rotate(360deg); }
        }
        @keyframes splash-ping {
            75%, 100% { transform: scale(2); opacity: 0; }
        }
        @keyframes splash-progress {
            0% { width: 8%; }
            50% { width: 68%; }
            100% { width: 92%; }
        }
    </style>
</head>

    <script>
        (function () {
            var splash = document.getElementById('splash');
            var closed = false;
            function close() {
                if (closed) return;
                closed = true;
                splash.classList.add('is-done');
                setTimeout(function () {
                    splash.remove();
                    window.dispatchEvent(new Event('splash:closed'));
                }, 500);
            }
            // The app closes the splash as soon as its first screen is ready.
            window.__closeSplash = close;
            // Fallback if the app script is slow or fails to start.
            setTimeout(close, 4000);
        })();
    </script>
