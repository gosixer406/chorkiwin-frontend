name: Deploy chorkiwin-frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-chorkiwin-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deploy
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 30m

          script: |
            set -e

            APP_DIR=/var/www/normal-b2b-service/chorkiwin-frontend

            echo "🚀 Starting deployment..."
            echo "📂 Project directory: $APP_DIR"

            cd "$APP_DIR"

            echo "🔄 Syncing latest code..."
            git fetch origin main
            git reset --hard origin/main

            APP_PORT=$(grep -E '^APP_PORT=' .env 2>/dev/null | cut -d= -f2 | tr -d '\r' || true)
            APP_PORT=${APP_PORT:-8015}

            docker network inspect b2b-net > /dev/null 2>&1 || docker network create b2b-net

            echo "🐳 Building image & restarting container..."
            docker compose up -d --build --remove-orphans

            echo "🩺 Health check..."

            for i in $(seq 1 20); do
              if curl -fsS "http://127.0.0.1:${APP_PORT}/healthz" > /dev/null; then
                echo "✅ App is up on port ${APP_PORT}"
                break
              fi

              if [ "$i" -eq 20 ]; then
                echo "❌ App did not respond. Last logs:"
                docker compose logs --tail=80 web
                exit 1
              fi

              sleep 3
            done

            # nginx serves this site straight from dist/ on the host: copy the
            # new build there. Old assets stay so pages already open keep working.
            echo "📁 Publishing build to dist/..."
            mkdir -p "$APP_DIR/dist"
            docker compose cp web:/usr/share/nginx/html/. "$APP_DIR/dist/"

            echo "📌 Current commit:"
            git log -1 --oneline

            echo "📦 Container:"
            docker compose ps
