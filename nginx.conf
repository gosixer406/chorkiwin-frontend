map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    absolute_redirect off;

    # Backend limit is 22 MiB.
    client_max_body_size 23m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # A variable upstream is resolved per request, so nginx still starts when
    # the backend is down and follows its new IP after a redeploy.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://b2b-backend:5000;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Original-URI $request_uri;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /api/ {
        proxy_pass $backend;
        proxy_read_timeout 120s;
    }

    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML goes through the backend so each domain gets its own title and icons.
    location = / {
        error_page 418 = @shell;
        return 418;
    }

    location = /index.html {
        error_page 418 = @shell;
        return 418;
    }

    location / {
        try_files $uri @shell;
    }

    location @shell {
        rewrite ^ /api/site-shell break;
        proxy_pass $backend;
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @static_index;
    }

    # Backend unavailable: still serve the app with the build's default branding.
    location @static_index {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }
}
